<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnvLint - Environment Validator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 1.1em;
        }

        textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 300px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .results.success {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .results.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .results h2 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .results.success h2 {
            color: #155724;
        }

        .results.error h2 {
            color: #721c24;
        }

        .error-list {
            list-style: none;
        }

        .error-list li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .error-list li:before {
            content: "•";
            position: absolute;
            left: 10px;
            font-weight: bold;
        }

        .icon {
            font-size: 1.5em;
        }

        .example-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .example-link:hover {
            text-decoration: underline;
        }

        .examples {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.95em;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 EnvLint</h1>
        <p class="subtitle">Validate your .env files against a schema</p>

        <form id="validateForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="envContent">.env File Content:</label>
                    <textarea id="envContent" name="envContent" placeholder="DB_URL=localhost&#10;API_KEY=abc123&#10;PORT=3000">DB_URL=localhost
API_KEY=abc123
PORT=3000</textarea>
                </div>

                <div class="form-group">
                    <label for="schemaContent">Schema (JSON):</label>
                    <textarea id="schemaContent" name="schemaContent" placeholder='{&#10;  "required": ["DB_URL", "API_KEY"],&#10;  "pattern": {&#10;    "PORT": "^[0-9]+$"&#10;  },&#10;  "allowed": ["DB_URL", "API_KEY", "PORT"]&#10;}'>&#123;
  "required": ["DB_URL", "API_KEY"],
  "pattern": &#123;
    "PORT": "^[0-9]+$"
  &#125;,
  "allowed": ["DB_URL", "API_KEY", "PORT"]
&#125;</textarea>
                </div>
            </div>

            <button type="submit">Validate</button>
        </form>

        <div class="examples">
            <strong>Try these examples:</strong>
            <a class="example-link" onclick="loadMissingKeyExample()">Missing Required Key</a> |
            <a class="example-link" onclick="loadUnknownKeyExample()">Unknown Key</a> |
            <a class="example-link" onclick="loadPatternViolationExample()">Pattern Violation</a> |
            <a class="example-link" onclick="loadValidExample()">Valid Example</a>
        </div>

        <div id="results" class="results">
            <h2><span class="icon"></span><span id="resultsTitle"></span></h2>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        document.getElementById('validateForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const envContent = document.getElementById('envContent').value;
            const schemaContent = document.getElementById('schemaContent').value;

            try {
                const response = await fetch('/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        env_content: envContent,
                        schema_content: schemaContent
                    })
                });

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                displayResults({
                    success: false,
                    errors: ['Error communicating with server: ' + error.message]
                });
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            const resultsTitle = document.getElementById('resultsTitle');
            const resultsContent = document.getElementById('resultsContent');

            resultsDiv.classList.remove('success', 'error');
            resultsDiv.classList.add('show');

            if (data.success) {
                resultsDiv.classList.add('success');
                document.querySelector('.icon').textContent = '✅';
                resultsTitle.textContent = 'Validation Passed!';

                // Use textContent for safe rendering
                resultsContent.innerHTML = '';
                const p = document.createElement('p');
                p.textContent = 'All validations passed successfully.';
                resultsContent.appendChild(p);
            } else {
                resultsDiv.classList.add('error');
                document.querySelector('.icon').textContent = '❌';
                resultsTitle.textContent = 'Validation Failed';

                // Use createElement and textContent to prevent XSS
                resultsContent.innerHTML = '';

                const p = document.createElement('p');
                const strong = document.createElement('strong');
                strong.textContent = `${data.errors.length} error(s) found:`;
                p.appendChild(strong);
                resultsContent.appendChild(p);

                const ul = document.createElement('ul');
                ul.className = 'error-list';

                data.errors.forEach(err => {
                    const li = document.createElement('li');
                    li.textContent = err; // Safe - uses textContent
                    ul.appendChild(li);
                });

                resultsContent.appendChild(ul);
            }
        }

        function loadMissingKeyExample() {
            document.getElementById('envContent').value = 'DB_URL=localhost\nPORT=3000';
            document.getElementById('schemaContent').value = JSON.stringify({
                "required": ["DB_URL", "API_KEY"],
                "pattern": {},
                "allowed": ["DB_URL", "API_KEY", "PORT"]
            }, null, 2);
        }

        function loadUnknownKeyExample() {
            document.getElementById('envContent').value = 'DB_URL=localhost\nAPI_KEY=abc123\nSECRET_TOKEN=xyz';
            document.getElementById('schemaContent').value = JSON.stringify({
                "required": ["DB_URL", "API_KEY"],
                "pattern": {},
                "allowed": ["DB_URL", "API_KEY"]
            }, null, 2);
        }

        function loadPatternViolationExample() {
            document.getElementById('envContent').value = 'DB_URL=localhost\nAPI_KEY=abc123\nPORT=not-a-number';
            document.getElementById('schemaContent').value = JSON.stringify({
                "required": ["DB_URL", "API_KEY"],
                "pattern": {
                    "PORT": "^[0-9]+$"
                },
                "allowed": ["DB_URL", "API_KEY", "PORT"]
            }, null, 2);
        }

        function loadValidExample() {
            document.getElementById('envContent').value = 'DB_URL=localhost\nAPI_KEY=abc123\nPORT=3000';
            document.getElementById('schemaContent').value = JSON.stringify({
                "required": ["DB_URL", "API_KEY"],
                "pattern": {
                    "PORT": "^[0-9]+$"
                },
                "allowed": ["DB_URL", "API_KEY", "PORT"]
            }, null, 2);
        }
    </script>
</body>
</html>
