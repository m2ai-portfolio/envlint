<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnvLint - Environment Validator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-grid-full {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .inline-group {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .inline-group .form-group {
            flex: 1;
        }

        .inline-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .inline-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }

        .git-status-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid;
        }

        .git-status-box.tracked {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .git-status-box.ignored {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .git-status-box.not-in-repo {
            background: #e2e3e5;
            border-color: #6c757d;
            color: #383d41;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 1.1em;
        }

        textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 300px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .results.success {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .results.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .results h2 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .results.success h2 {
            color: #155724;
        }

        .results.error h2 {
            color: #721c24;
        }

        .results.warning {
            background: #fff3cd;
            border: 2px solid #ffc107;
        }

        .results.warning h2 {
            color: #856404;
        }

        .error-list {
            list-style: none;
        }

        .error-list li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .error-list li:before {
            content: "•";
            position: absolute;
            left: 10px;
            font-weight: bold;
        }

        .warning-list {
            list-style: none;
            margin-top: 15px;
        }

        .warning-list li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .warning-list li:before {
            content: "⚠";
            position: absolute;
            left: 5px;
            font-weight: bold;
        }

        .icon {
            font-size: 1.5em;
        }

        .example-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .example-link:hover {
            text-decoration: underline;
        }

        .examples {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.95em;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 EnvLint</h1>
        <p class="subtitle">Validate your .env files against a schema and check usage</p>

        <form id="validateForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="envContent">.env File Content:</label>
                    <textarea id="envContent" name="envContent" placeholder="DB_URL=localhost&#10;API_KEY=abc123&#10;PORT=3000">DB_URL=localhost
API_KEY=abc123
PORT=3000</textarea>
                </div>

                <div class="form-group">
                    <label for="schemaContent">Schema (JSON):</label>
                    <textarea id="schemaContent" name="schemaContent" placeholder='{&#10;  "required": ["DB_URL", "API_KEY"],&#10;  "pattern": {&#10;    "PORT": "^[0-9]+$"&#10;  },&#10;  "allowed": ["DB_URL", "API_KEY", "PORT"]&#10;}'>&#123;
  "required": ["DB_URL", "API_KEY"],
  "pattern": &#123;
    "PORT": "^[0-9]+$"
  &#125;,
  "allowed": ["DB_URL", "API_KEY", "PORT"]
&#125;</textarea>
                </div>
            </div>

            <div class="form-grid-full">
                <div class="inline-group">
                    <div class="form-group" style="flex: 4;">
                        <label for="sourceContent">Source Code (Optional - for usage checking):</label>
                        <textarea id="sourceContent" name="sourceContent" placeholder="import os&#10;db_url = os.getenv('DB_URL')&#10;api_key = os.environ.get('API_KEY')"></textarea>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="language">Language:</label>
                        <select id="language" name="language">
                            <option value="python">Python</option>
                            <option value="typescript">TypeScript/JS</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="checkGit" name="checkGit" checked>
                <label for="checkGit">Check git tracking (only works if running locally with git repository)</label>
            </div>

            <button type="submit">Validate</button>
        </form>

        <div class="examples">
            <strong>Try these examples:</strong>
            <a class="example-link" onclick="loadMissingKeyExample()">Missing Required Key</a> |
            <a class="example-link" onclick="loadUnknownKeyExample()">Unknown Key</a> |
            <a class="example-link" onclick="loadPatternViolationExample()">Pattern Violation</a> |
            <a class="example-link" onclick="loadUsageCheckExample()">Usage Check</a> |
            <a class="example-link" onclick="loadValidExample()">Valid Example</a>
        </div>

        <div id="results" class="results">
            <h2><span class="icon"></span><span id="resultsTitle"></span></h2>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        document.getElementById('validateForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const envContent = document.getElementById('envContent').value;
            const schemaContent = document.getElementById('schemaContent').value;
            const sourceContent = document.getElementById('sourceContent').value;
            const language = document.getElementById('language').value;
            const checkGit = document.getElementById('checkGit').checked;

            try {
                const response = await fetch('/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        env_content: envContent,
                        schema_content: schemaContent,
                        source_code: sourceContent,
                        language: language,
                        check_git: checkGit
                    })
                });

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                displayResults({
                    success: false,
                    errors: ['Error communicating with server: ' + error.message],
                    warnings: []
                });
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function displayGitStatus(gitStatus) {
            if (!gitStatus) return null;

            const gitBox = document.createElement('div');
            gitBox.className = 'git-status-box';

            if (gitStatus.is_tracked) {
                gitBox.classList.add('tracked');
                gitBox.textContent = '❌ ' + gitStatus.message;
            } else if (gitStatus.is_ignored) {
                gitBox.classList.add('ignored');
                gitBox.textContent = '✅ ' + gitStatus.message;
            } else if (gitStatus.is_git_repo) {
                gitBox.classList.add('not-in-repo');
                gitBox.textContent = '💡 ' + gitStatus.message;
            } else {
                gitBox.classList.add('not-in-repo');
                gitBox.textContent = '💡 ' + gitStatus.message;
            }

            return gitBox;
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            const resultsTitle = document.getElementById('resultsTitle');
            const resultsContent = document.getElementById('resultsContent');

            resultsDiv.classList.remove('success', 'error', 'warning');
            resultsDiv.classList.add('show');

            if (data.success) {
                // Check if there are warnings
                if (data.warnings && data.warnings.length > 0) {
                    resultsDiv.classList.add('warning');
                    document.querySelector('.icon').textContent = '⚠️';
                    resultsTitle.textContent = 'Validation Passed with Warnings';

                    resultsContent.innerHTML = '';
                    const p = document.createElement('p');
                    p.textContent = 'Schema validation passed, but there are warnings:';
                    resultsContent.appendChild(p);

                    const ul = document.createElement('ul');
                    ul.className = 'warning-list';

                    data.warnings.forEach(warn => {
                        const li = document.createElement('li');
                        li.textContent = warn;
                        ul.appendChild(li);
                    });

                    resultsContent.appendChild(ul);

                    // Add git status if available
                    if (data.git_status) {
                        const gitBox = displayGitStatus(data.git_status);
                        if (gitBox) resultsContent.appendChild(gitBox);
                    }
                } else {
                    resultsDiv.classList.add('success');
                    document.querySelector('.icon').textContent = '✅';
                    resultsTitle.textContent = 'Validation Passed!';

                    // Use textContent for safe rendering
                    resultsContent.innerHTML = '';
                    const p = document.createElement('p');
                    p.textContent = 'All validations passed successfully.';
                    resultsContent.appendChild(p);

                    // Add git status if available
                    if (data.git_status) {
                        const gitBox = displayGitStatus(data.git_status);
                        if (gitBox) resultsContent.appendChild(gitBox);
                    }
                }
            } else {
                resultsDiv.classList.add('error');
                document.querySelector('.icon').textContent = '❌';
                resultsTitle.textContent = 'Validation Failed';

                // Use createElement and textContent to prevent XSS
                resultsContent.innerHTML = '';

                const p = document.createElement('p');
                const strong = document.createElement('strong');
                strong.textContent = `${data.errors.length} error(s) found:`;
                p.appendChild(strong);
                resultsContent.appendChild(p);

                const ul = document.createElement('ul');
                ul.className = 'error-list';

                data.errors.forEach(err => {
                    const li = document.createElement('li');
                    li.textContent = err; // Safe - uses textContent
                    ul.appendChild(li);
                });

                resultsContent.appendChild(ul);

                // Add warnings if present
                if (data.warnings && data.warnings.length > 0) {
                    const warnP = document.createElement('p');
                    warnP.style.marginTop = '20px';
                    const warnStrong = document.createElement('strong');
                    warnStrong.textContent = `${data.warnings.length} warning(s):`;
                    warnP.appendChild(warnStrong);
                    resultsContent.appendChild(warnP);

                    const warnUl = document.createElement('ul');
                    warnUl.className = 'warning-list';

                    data.warnings.forEach(warn => {
                        const li = document.createElement('li');
                        li.textContent = warn;
                        warnUl.appendChild(li);
                    });

                    resultsContent.appendChild(warnUl);
                }

                // Add git status if available
                if (data.git_status) {
                    const gitBox = displayGitStatus(data.git_status);
                    if (gitBox) resultsContent.appendChild(gitBox);
                }
            }
        }

        function loadMissingKeyExample() {
            document.getElementById('envContent').value = 'DB_URL=localhost\nPORT=3000';
            document.getElementById('schemaContent').value = JSON.stringify({
                "required": ["DB_URL", "API_KEY"],
                "pattern": {},
                "allowed": ["DB_URL", "API_KEY", "PORT"]
            }, null, 2);
        }

        function loadUnknownKeyExample() {
            document.getElementById('envContent').value = 'DB_URL=localhost\nAPI_KEY=abc123\nSECRET_TOKEN=xyz';
            document.getElementById('schemaContent').value = JSON.stringify({
                "required": ["DB_URL", "API_KEY"],
                "pattern": {},
                "allowed": ["DB_URL", "API_KEY"]
            }, null, 2);
        }

        function loadPatternViolationExample() {
            document.getElementById('envContent').value = 'DB_URL=localhost\nAPI_KEY=abc123\nPORT=not-a-number';
            document.getElementById('schemaContent').value = JSON.stringify({
                "required": ["DB_URL", "API_KEY"],
                "pattern": {
                    "PORT": "^[0-9]+$"
                },
                "allowed": ["DB_URL", "API_KEY", "PORT"]
            }, null, 2);
        }

        function loadValidExample() {
            document.getElementById('envContent').value = 'DB_URL=localhost\nAPI_KEY=abc123\nPORT=3000';
            document.getElementById('schemaContent').value = JSON.stringify({
                "required": ["DB_URL", "API_KEY"],
                "pattern": {
                    "PORT": "^[0-9]+$"
                },
                "allowed": ["DB_URL", "API_KEY", "PORT"]
            }, null, 2);
            document.getElementById('sourceContent').value = '';
        }

        function loadUsageCheckExample() {
            document.getElementById('envContent').value = 'DB_URL=localhost\nAPI_KEY=abc123\nPORT=3000\nUNUSED_VAR=test';
            document.getElementById('schemaContent').value = JSON.stringify({
                "required": ["DB_URL", "API_KEY"],
                "pattern": {
                    "PORT": "^[0-9]+$"
                },
                "allowed": ["DB_URL", "API_KEY", "PORT", "UNUSED_VAR", "MISSING_VAR"]
            }, null, 2);
            document.getElementById('sourceContent').value = 'import os\n\ndb_url = os.getenv(\'DB_URL\')\napi_key = os.environ.get(\'API_KEY\')\nmissing = os.environ[\'MISSING_VAR\']';
            document.getElementById('language').value = 'python';
        }
    </script>
</body>
</html>
